# Pre-Quattro Hyprland include. Quattro uses hyprland.lua instead.
$activeBorderColor = rgba(e15a48ee) rgba(f0b45aee) 45deg
$inactiveBorderColor = rgba(2c2438aa)

general {
    col.active_border = $activeBorderColor
    col.inactive_border = $inactiveBorderColor
}

group {
    col.border_active = $activeBorderColor
    col.border_inactive = $inactiveBorderColor
}
